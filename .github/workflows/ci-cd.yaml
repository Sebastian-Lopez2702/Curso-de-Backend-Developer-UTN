name: API CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Pruebas Unitarias y de Integración
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Instalar dependencias
        run: yarn install --frozen-lockfile

      - name: Compilar
        run: yarn build

      - name: Ejecutar Tests (Jest + Supertest)
        env:
          NODE_ENV: test
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/ecommerce_test_db
          JWT_SECRET: test_secret_super_seguro
          INITIAL_ADMIN_EMAIL: admin@test.com
          INITIAL_ADMIN_PASSWORD: Password123!
          INITIAL_ADMIN_DNI: 12345678
        run: yarn test