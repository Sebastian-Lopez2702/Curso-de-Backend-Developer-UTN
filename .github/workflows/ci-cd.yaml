name: API CI/CD Pipeline

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Pruebas Unitarias y de Integración
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependencias
        run: yarn install --immutable

      - name: Configurar variables de entorno desde .env.example
        run: cp .env.example .env

      - name: Compilar
        run: yarn build

      - name: Ejecutar Tests (Jest + Supertest)
        run: yarn test

      - name: Ejecutar Linter (ESLint)
        run: yarn lint

  deploy:
    name: Despliegue en Railway
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Desplegar a Railway
        run: |
          if [ -n "$RAILWAY_DEPLOY_WEBHOOK_URL" ]; then
            echo "Disparando despliegue mediante Webhook de Railway..."
            curl -fsSL -X POST "$RAILWAY_DEPLOY_WEBHOOK_URL"
          elif [ -n "$RAILWAY_TOKEN" ]; then
            echo "Desplegando mediante Railway CLI..."
            npm i -g @railway/cli
            railway up --service Curso-de-Backend-Developer-UTN --detach
          else
            echo "::error::No fue posible desplegar el codigo en Railway."
            exit 1
          fi
        env:
          RAILWAY_DEPLOY_WEBHOOK_URL: ${{ secrets.RAILWAY_DEPLOY_WEBHOOK_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
