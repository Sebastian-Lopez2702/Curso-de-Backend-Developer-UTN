name: API CI/CD Pipeline

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Pruebas Unitarias y de Integración
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "yarn"

      - name: Habilitar Corepack
        run: corepack enable

      - name: Instalar dependencias
        run: yarn install --immutable

      - name: Configurar variables de entorno desde .env.example
        run: cp .env.example .env

      - name: Compilar
        run: yarn build

      - name: Ejecutar Tests (Jest + Supertest)
        run: yarn test
